<div class="page-header">
  <div class="page-header-left"><h1>Suppliers</h1><p>Manage your suppliers and vendors</p></div>
  <div class="page-header-actions"><button class="btn btn-primary" (click)="open()"><i class="pi pi-plus"></i> Add Supplier</button></div>
</div>
<div class="card">
  <div class="toolbar">
    <div class="search-bar"><i class="pi pi-search"></i><input [(ngModel)]="search" (ngModelChange)="filter()" placeholder="Search suppliers..." name="s"></div>
    <button class="btn btn-outline btn-sm" (click)="load()"><i class="pi pi-refresh"></i></button>
  </div>
  <div class="loading-state" *ngIf="loading"><div class="spinner"></div><p>Loading...</p></div>
  <div class="error-state" *ngIf="error && !loading"><i class="pi pi-exclamation-circle"></i>{{ error }}</div>
  <div class="table-wrap" *ngIf="!loading && !error">
    <table>
      <thead><tr><th>Supplier Name</th><th>Contact Person</th><th>Phone</th><th>Email</th><th>TIN</th><th>Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let s of filtered">
          <td><strong>{{ s.supplierName }}</strong></td>
          <td>{{ s.contactPerson ?? '—' }}</td>
          <td>{{ s.phone ?? '—' }}</td>
          <td>{{ s.email ?? '—' }}</td>
          <td><code>{{ s.tinNumber ?? '—' }}</code></td>
          <td><button class="btn btn-ghost" title="Delete" (click)="delete(s.id,s.supplierName)"><i class="pi pi-trash delete-icon"></i></button></td>
        </tr>
        <tr *ngIf="filtered.length===0"><td colspan="6"><div class="empty-state"><i class="pi pi-truck"></i><h3>No suppliers found</h3></div></td></tr>
      </tbody>
    </table>
  </div>
</div>
<div class="modal-overlay" *ngIf="showModal">
  <div class="modal">
    <div class="modal-header"><h2><i class="pi pi-truck"></i> Add Supplier</h2><button class="close-btn" (click)="showModal=false">×</button></div>
    <div class="modal-body">
      <div class="error-state" *ngIf="modalError"><i class="pi pi-exclamation-circle"></i>{{ modalError }}</div>
      <div class="form-grid">
        <div class="form-group"><label>Supplier Name *</label><input [(ngModel)]="form.supplierName" name="sn" placeholder="Company name" required></div>
        <div class="form-group"><label>Contact Person</label><input [(ngModel)]="form.contactPerson" name="cp" placeholder="Contact name"></div>
        <div class="form-group"><label>Phone</label><input [(ngModel)]="form.phone" name="ph" placeholder="Phone number"></div>
        <div class="form-group"><label>Email</label><input [(ngModel)]="form.email" name="em" type="email" placeholder="Email"></div>
        <div class="form-group"><label>TIN Number</label><input [(ngModel)]="form.tinNumber" name="tin" placeholder="TIN"></div>
        <div class="form-group"><label>Address</label><input [(ngModel)]="form.address" name="addr" placeholder="Address"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" (click)="showModal=false">Cancel</button>
      <button class="btn btn-primary" (click)="save()" [disabled]="submitting">
        <i class="pi pi-spin pi-spinner" *ngIf="submitting"></i>{{ submitting?'Saving...':'Save Supplier' }}
      </button>
    </div>
  </div>
</div>
