<div class="page-header">
  <div class="page-header-left"><h1>Store Issue Vouchers</h1><p>Track all issued store vouchers</p></div>
  <div class="page-header-actions">
    <button class="btn btn-outline btn-sm" (click)="load()"><i class="pi pi-refresh"></i> Refresh</button>
  </div>
</div>
<div class="card">
  <div class="toolbar">
    <div class="search-bar">
      <i class="pi pi-search"></i>
      <input [(ngModel)]="search" (ngModelChange)="filter()" placeholder="Search vouchers..." name="s">
    </div>
  </div>
  <div class="loading-state" *ngIf="loading"><div class="spinner"></div><p>Loading...</p></div>
  <div class="error-state" *ngIf="error && !loading"><i class="pi pi-exclamation-circle"></i>{{ error }}</div>
  <div class="table-wrap" *ngIf="!loading && !error">
    <table>
      <thead>
        <tr>
          <th>SIV Number</th>
          <th>Issued To</th>
          <th>Status</th>
          <th>Issue Date</th>
          <th>Total Items</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let i of filtered">
          <td><code>{{ i.sivNumber }}</code></td>
          <td>{{ i.issuedToName ?? '—' }}</td>
          <td><span class="badge" [ngClass]="statusClass(i.status)">{{ i.status }}</span></td>
          <td>{{ i.issueDate | date:'mediumDate' }}</td>
          <td>{{ i.totalItems ?? '—' }}</td>
        </tr>
        <tr *ngIf="filtered.length === 0">
          <td colspan="5">
            <div class="empty-state">
              <i class="pi pi-file-export"></i>
              <h3>No vouchers found</h3>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
