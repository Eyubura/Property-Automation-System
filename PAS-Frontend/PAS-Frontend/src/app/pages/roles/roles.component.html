<div class="page-header">
  <div class="page-header-left"><h1>Roles</h1><p>Manage system roles and permissions</p></div>
  <div class="page-header-actions"><button class="btn btn-primary" (click)="open()"><i class="pi pi-plus"></i> Add Role</button></div>
</div>
<div class="card">
  <div class="loading-state" *ngIf="loading"><div class="spinner"></div><p>Loading...</p></div>
  <div class="error-state" *ngIf="error && !loading"><i class="pi pi-exclamation-circle"></i>{{ error }}</div>
  <div class="table-wrap" *ngIf="!loading && !error">
    <table>
      <thead><tr><th>Role Name</th><th>Description</th><th>Permissions</th><th>Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let r of items">
          <td><strong>{{ r.name }}</strong></td>
          <td>{{ r.description ?? '—' }}</td>
          <td><span class="badge badge-primary">{{ r.permissions?.length ?? 0 }} permissions</span></td>
          <td><button class="btn btn-ghost" title="Delete" (click)="delete(r.id,r.name)"><i class="pi pi-trash delete-icon"></i></button></td>
        </tr>
        <tr *ngIf="items.length===0"><td colspan="4"><div class="empty-state"><i class="pi pi-shield"></i><h3>No roles found</h3></div></td></tr>
      </tbody>
    </table>
  </div>
</div>
<div class="modal-overlay" *ngIf="showModal">
  <div class="modal">
    <div class="modal-header"><h2><i class="pi pi-shield"></i> Add Role</h2><button class="close-btn" (click)="showModal=false">×</button></div>
    <div class="modal-body">
      <div class="error-state" *ngIf="modalError"><i class="pi pi-exclamation-circle"></i>{{ modalError }}</div>
      <div class="form-group"><label>Role Name *</label><input [(ngModel)]="form.name" name="n" placeholder="e.g. Manager" required></div>
      <div class="form-group"><label>Description</label><input [(ngModel)]="form.description" name="d" placeholder="Role description"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" (click)="showModal=false">Cancel</button>
      <button class="btn btn-primary" (click)="save()" [disabled]="submitting">
        <i class="pi pi-spin pi-spinner" *ngIf="submitting"></i>{{ submitting?'Saving...':'Save Role' }}
      </button>
    </div>
  </div>
</div>
