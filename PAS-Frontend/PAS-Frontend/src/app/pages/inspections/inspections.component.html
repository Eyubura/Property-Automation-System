<div class="page-header"><div class="page-header-left"><h1>Inspections</h1><p>Track inspection logs and results</p></div></div>
<div class="card">
  <div class="toolbar">
    <div class="search-bar"><i class="pi pi-search"></i><input [(ngModel)]="search" (ngModelChange)="filter()" placeholder="Search inspections..." name="s"></div>
    <button class="btn btn-outline btn-sm" (click)="load()"><i class="pi pi-refresh"></i></button>
  </div>
  <div class="loading-state" *ngIf="loading"><div class="spinner"></div><p>Loading...</p></div>
  <div class="error-state" *ngIf="error && !loading"><i class="pi pi-exclamation-circle"></i>{{ error }}</div>
  <div class="table-wrap" *ngIf="!loading && !error">
    <table>
      <thead><tr><th>GRN Number</th><th>Inspector</th><th>Status</th><th>Date</th><th>Notes</th></tr></thead>
      <tbody>
        <tr *ngFor="let i of filtered">
          <td><code>{{ i.receivingNoteNumber ?? '—' }}</code></td>
          <td>{{ i.inspectedBy ?? '—' }}</td>
          <td><span class="badge" [ngClass]="statusClass(i.status)">{{ i.status }}</span></td>
          <td>{{ i.inspectionDate | date:'mediumDate' }}</td>
          <td>{{ i.deviationNotes ?? '—' }}</td>
        </tr>
        <tr *ngIf="filtered.length===0"><td colspan="5"><div class="empty-state"><i class="pi pi-search"></i><h3>No inspections found</h3></div></td></tr>
      </tbody>
    </table>
  </div>
</div>
