<div class="forgot-page">
  <div class="forgot-card">
    <div class="logo-area">
      <img src="assets/images/africom-logo.png" alt="AFRICOM" onerror="this.style.display='none'">
      <h1>AFRICOM PAS</h1>
    </div>
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your email and we'll send you a reset link.</p>
    <div class="success-box" *ngIf="sent">
      <i class="pi pi-check-circle"></i> Reset link sent! Check your email.
    </div>
    <div class="error-box" *ngIf="error">
      <i class="pi pi-exclamation-circle"></i> {{ error }}
    </div>
    <div class="form-group" *ngIf="!sent">
      <label>Email Address</label>
      <div class="input-wrapper">
        <i class="pi pi-envelope"></i>
        <input type="email" [(ngModel)]="email" placeholder="your@email.com">
      </div>
    </div>
    <button class="btn-submit" *ngIf="!sent" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Sending...' : 'Send Reset Link' }}
    </button>
    <a routerLink="/auth/login" class="back-link">
      <i class="pi pi-arrow-left"></i> Back to Login
    </a>
  </div>
</div>
